[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapcheck"
version = "0.1.0"
description = "Detect opening gaps on US equities without trusting the first numbers a data feed delivers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Laura Kruse-Stecher" }]
maintainers = [{ name = "Elcando GmbH" }]
keywords = ["stocks", "opening gap", "data quality", "market data", "quant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/Elcando-GmbH/gapcheck"
Issues = "https://github.com/Elcando-GmbH/gapcheck/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gapcheck"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
